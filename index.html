window.unityShowBanner = function(msg, type) {
    console.log('Unity Banner:', type, msg);
    const warningBanner = document.querySelector("#unity-warning");
    if (!warningBanner) return;
    function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    const div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') {
        div.style = 'background: red; padding: 10px; color: white;';
    } else if (type == 'warning') {
        div.style = 'background: yellow; padding: 10px; color: black;';
        setTimeout(function() {
            if (warningBanner && warningBanner.contains(div)) {
                warningBanner.removeChild(div);
            }
            updateBannerVisibility();
        }, 5000);
    }
    updateBannerVisibility();
};

function loadExternalScript(src) {
    return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
    });
}

const originalFetch = window.fetch;
window.fetch = async function (...args) {

    if (typeof url === "string" && url.startsWith("StreamingAssets/")) {
        url = BASE_URL + url;
        args[0] = url;
    }
    try {
        const response = await originalFetch.apply(this, args);
        if (response.status === 403 || response.status === 404) {
            console.warn(`Failed to load ${url}, status: ${response.status}`);
        }
        return response;
    } catch (error) {
        console.error(`Fetch error for ${url}:`, error);
        throw error;
    }
};
